ct."],"faqs":[["Can you guarantee media coverage?","No. Editorial decisions remain with independent media organisations."],["Can you prepare a press release only?","Yes. Drafting-only work can be scoped separately from outreach."],["Who approves quotes and facts?","The client and named spokesperson must approve all quotes, facts and release timing."]]}];const MORE_FAQS={"social-media/x-twitter-management":[["Do you write and publish posts for us?","Post and thread copy is prepared and, where agreed, published within the approved scope. Content is shared for your approval before it goes live."],["Can you guarantee followers or reach on X?","No. Reach and follower growth depend on content, audience and platform changes, so specific results cannot be guaranteed."]],"social-media/telegram-channel-management":[["Do you add people to my channel?","No. A channel should grow through people choosing to join. We plan the content and channel structure and do not add people without their consent."],["Who moderates the community?","A moderation plan and community guidelines are prepared with you. The level of day-to-day moderation support is confirmed in the agreed scope."]],"social-media/whatsapp-business-management":[["Do I need a WhatsApp Business account?","A WhatsApp Business account is recommended for profile, catalogue and quick-reply features. We can review your current setup and advise what to change."],["Will you message my customers directly?","Only within the agreed scope and only where customers have opted in. Reply guidance and enquiry routing are planned with your team."]],"content-production/content-strategy-and-calendar":[["How far ahead is the calendar planned?","Calendars can be planned monthly or around a campaign. The period is confirmed when the scope is agreed."],["Do I approve the plan before it is used?","Yes. Priorities and approval checkpoints are part of the plan, so you review it before content is produced."]],"content-production/ideas-scripts-and-storyboards":[["Can you write scripts for videos I record myself?","Yes. Scripts and scene outlines can be prepared for videos that you or your team record. The format is agreed when the scope is defined."],["Are revisions included?","Revision rounds are agreed in the scope before work begins."]],"content-production/video-shooting-and-production":[["Are equipment and location included?","Production requirements such as location, talent and equipment are defined in the shoot brief. Any third-party or location costs are clarified in the proposal."],["Can you plan product videos?","Yes. Product or presenter shot planning is part of this service. The exact shoot is scoped before work begins."]],"content-production/content-editing-and-delivery":[["Do you edit footage we provide?","Yes. Footage is reviewed against an edit brief, and cuts, captions and exports are prepared as agreed."],["How many revisions are included?","Revision rounds are agreed in the scope, with final handover once the work is approved."]],"website-development/business-website":[["How many pages will my website have?","The sitemap and page list are defined with you at the start. The final page count depends on the agreed scope."],["Will the website work on mobile?","Responsive implementation and review are part of the scope, covering mobile and desktop layouts."]],"website-development/landing-page-design":[["What is a landing page used for?","It is built around one campaign, offer or enquiry goal, so visitors see a single clear next step."],["Will the page include an enquiry form?","Form placement and content structure are planned as part of the page. Exact form behaviour is confirmed in the scope."]],"website-development/ui-ux-and-website-improvement":[["Do you rebuild my whole website?","Not necessarily. We review the current pages and prioritise improvements within the agreed scope."],["Will I get a list of recommended changes?","Yes. A prioritised improvement list is part of this service."]],"websit igital Marketing Agency in Indore: 7 Questions to Ask",d:"October 2026",ex:"A practical checklist for comparing agencies on scope, reporting, ownership and honesty before you sign.",b:["Agency websites often look similar, so the useful differences show up in the questions you ask. These seven help you compare options fairly.",["h","1. What exactly is included, and what is not?"],"Ask for the scope in writing: deliverables, number of revisions, reporting frequency and who does what. Vague scopes lead to disagreements later.",["h","2. Who owns the accounts and assets?"],"Your ad accounts, domain, website files and creatives should belong to you. Confirm this before work starts.",["h","3. How will progress be reported?"],"Ask what you will see, how often, and in what format. Good reporting explains what was done and what happens next, not only numbers.",["h","4. What do you not promise?"],"Be careful with anyone who guarantees rankings, followers or sales. Search engines and ad platforms are controlled by others, so honest agencies explain what they can and cannot control.",["h","5. Can you show relevant work?"],"Ask for examples in a similar industry and what the goal was. Ask what the client contributed, since results depend on both sides.",["h","6. What costs are separate?"],"Ad spend, tool subscriptions, stock media and production costs are often separate from service fees. Ask for a clear list.",["h","7. How do we start and stop?"],"Understand the notice period, handover process and what you receive if you end the engagement.","A good agency will welcome these questions. If you would like to talk through your requirement, you can start a conversation with us on WhatsApp, with no obligation."]},{s:"google-ads-vs-meta-ads-for-local-businesses",t:"Google Ads vs Meta Ads: Which Should a Local Business Start With?",d:"October 2026",ex:"Intent versus interruption: how to choose a first advertising platform for a local business.",b:["Both platforms can bring enquiries, but they work differently, so the right starting point depends on how your customers decide.",["h","Google Ads: people who are already searching"],"Google Search shows your ad when someone types a query such as a service plus a city. The person already has a need, which often makes it a good first choice for urgent or high-intent services like clinics, repairs, legal help or coaching.",["h","Meta Ads: people who are browsing"],"Facebook and Instagram show ads to people based on interests and behaviour. They work well for visual products, events, offers, admissions and brand awareness, because you can show attractive creatives and build an audience before people search.",["h","How to decide"],["l",["Customers actively search for your service: start with Google Search.","Your offer is visual or impulse-driven: start with Meta.","Budget is small: begin with one platform and learn before adding the second.","You have a WhatsApp-first sales process: consider click-to-WhatsApp campaigns on Meta."]],["h","Whichever you choose"],"Set up conversion tracking first, send traffic to a page built for one action, and review results against an agreed goal. Platform results vary, so no honest agency can promise a specific number of leads."]},{s:"what-is-ai-search-geo-and-what-should-businesses-do",t:"What Is AI Search (GEO) and What Should Your Business Do About It?",d:"October 2026",ex:"AI assistants now answer questions directly. Here is what that means for how your business is found.",b:["More people now ask AI assistants and AI-powered search tools for recommendations and answers. Generative Engine Optimisation, or GEO, is about making your business easy for these tools to understand and describe accurately.",["h","What does GEO involve?"],["l",["Keeping your business name, address, phone and services identical across your website, profiles and listings.","Writing pages that answer real customer questions clearly and directly.","Adding structured data so machines can read key fa
